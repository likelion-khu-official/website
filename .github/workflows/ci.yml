name: CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'frontend/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: 변경 경로 감지
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
            frontend:
              - 'frontend/**'
              - 'shared/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 두 러너에 나눠 돌려 GH 무료 러너 4vCPU 한계를 우회 — 컨테이너 기반 무거운 통합테스트(*IntegrationTest)와
        # 나머지 단위/슬라이스 테스트를 분리. 분리 기준은 build.gradle의 testShard 필터 참고.
        shard: [unit, integration]
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 세팅
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 세팅
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 + 테스트 (${{ matrix.shard }})
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew compileJava test -PtestShard=${{ matrix.shard }}

  migration-guard:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 마이그레이션 버전 번호 충돌 확인
        run: |
          # actions/checkout이 pull_request 이벤트에서 기본으로 받는 건 PR merge ref라
          # 이 디렉터리엔 이미 머지 대상 브랜치 + 이 PR 양쪽 마이그레이션 파일이 전부 들어있다 —
          # git diff 없이 지금 있는 파일들만 보고 버전 번호(V 다음, __ 앞) 중복을 스캔하면 된다.
          # 각 PR을 단독으로 보면 문제가 없어 보여도, 서로 다른 두 브랜치가 동시에 개발되며
          # 각자 "다음 번호"를 추측해 같은 버전을 잡으면 머지 시점에만 드러난다 — Flyway가
          # CompositeMigrationResolver에서 FlywayException("Found more than one migration with
          # version X")을 던지고, 그게 Flyway를 쓰는 모든 테스트의 Spring 컨텍스트 기동 자체를
          # 막아서 이 PR과 무관해 보이는 마이그레이션 테스트들이 무더기로 같이 실패한다.
          declare -A seen
          DUPES=()
          for f in backend/src/main/resources/db/migration/V*.sql; do
            base=$(basename "$f")
            version=$(echo "$base" | sed -E 's/^V([0-9]+(\.[0-9]+)*)__.*/\1/')
            if [ -n "${seen[$version]}" ]; then
              DUPES+=("버전 $version: ${seen[$version]} ↔ $base")
            else
              seen[$version]="$base"
            fi
          done

          if [ ${#DUPES[@]} -eq 0 ]; then
            echo "버전 번호 중복 없음 — 통과"
            exit 0
          fi

          echo "::error::머지 대상 브랜치와 합쳤을 때 같은 Flyway 버전 번호를 쓰는 마이그레이션 파일이 있습니다:"
          printf '::error::%s\n' "${DUPES[@]}"
          echo "::error::겹치는 쪽 파일을 다른 버전 번호로 리네임하세요 — backend/.claude/skills/db-man/SKILL.md 절차 2번(타임스탬프 버전 권장) 참고."
          exit 1

      - name: 위험한 마이그레이션에 업그레이드 테스트 누락 확인
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # 새로 추가되거나 수정된 마이그레이션 파일 중 DROP TABLE/DELETE FROM이 있으면 "재생성/행 삭제" 패턴.
          # db-man 스킬 시나리오표 기준 컬럼 추가(nullable)·컬럼 이름 변경 두 케이스만 이 패턴 없이 처리 가능하고,
          # 나머지(컬럼 삭제·행 삭제·테이블 삭제·CHECK 신규/좁히기·FK 추가)는 전부 이 두 키워드 중 하나를 반드시 쓴다.
          # 수정(M)도 포함하는 이유: db-man 규칙상 머지된 파일은 수정 금지가 원칙이지만, 실제 V6 사고(#253)처럼
          # "배포가 실패해 flyway_schema_history에 한 번도 성공 기록이 안 남은" 마이그레이션은 예외적으로
          # 같은 PR 사이클 안에서 수정되어 나갔다 — Added만 보면 이 케이스를 놓친다.
          # --no-renames 필수: git이 파일명 유사도로 "이전 버전 번호 파일 → V6로 rename"을 감지하면
          # A/M 어느 쪽에도 안 잡힌다 — 실제 V6 첫 시도(9d7fe39, 테스트 없이 배포돼 CD가 실패한 커밋)가
          # V5 충돌로 파일명이 바뀌면서 생긴 rename이었고, --no-renames 없이 로컬 재현했을 때 실제로 놓쳤다.
          CHANGED_MIGRATIONS=$(git diff --no-renames --name-only --diff-filter=AM "$BASE" "$HEAD" -- 'backend/src/main/resources/db/migration/V*.sql')

          RISKY=()
          for f in $CHANGED_MIGRATIONS; do
            if grep -qiE 'drop[[:space:]]+table|delete[[:space:]]+from' "$f"; then
              RISKY+=("$f")
            fi
          done

          if [ ${#RISKY[@]} -eq 0 ]; then
            echo "DROP TABLE/DELETE FROM 패턴 없음 — 통과"
            exit 0
          fi

          echo "다음 마이그레이션이 테이블 재생성·행 삭제 패턴을 포함합니다:"
          printf ' - %s\n' "${RISKY[@]}"

          TEST_CHANGED=$(git diff --no-renames --name-only "$BASE" "$HEAD" -- 'backend/src/test/java/likelion/khu/website/migration/')
          if [ -z "$TEST_CHANGED" ]; then
            echo "::error::위 마이그레이션에 대응하는 업그레이드 테스트(backend/src/test/.../migration/ 아래) 변경이 이 PR에 없습니다."
            echo "::error::테이블 재생성·행 삭제가 들어간 마이그레이션은 MigrationUpgradeHarness 기반 업그레이드 테스트가 필수입니다 — backend/.claude/skills/db-man/SKILL.md '시나리오별 빠른 대응표' 참고."
            exit 1
          fi

          echo "업그레이드 테스트 변경 확인됨 — 통과"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 세팅
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 린트
        working-directory: frontend
        run: npm run lint

      - name: 빌드 (타입체크 포함)
        working-directory: frontend
        run: npm run build

  comment:
    needs: [changes, backend, frontend, migration-guard]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR 코멘트
        uses: actions/github-script@v7
        with:
          script: |
            const backendRan = '${{ needs.changes.outputs.backend }}' === 'true';
            const frontendRan = '${{ needs.changes.outputs.frontend }}' === 'true';
            const backendResult = '${{ needs.backend.result }}';
            const frontendResult = '${{ needs.frontend.result }}';
            const migrationGuardResult = '${{ needs.migration-guard.result }}';

            const failed = (backendRan && backendResult !== 'success') || (frontendRan && frontendResult !== 'success')
              || (backendRan && migrationGuardResult !== 'success');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const note = '> 이 빌드는 현재 브랜치를 머지 대상 브랜치와 합친 상태에서 돌린 결과입니다.';

            const parts = [];
            if (backendRan) parts.push(`백엔드 ${backendResult === 'success' ? '✅' : '❌'}`);
            if (backendRan) parts.push(`마이그레이션 가드 ${migrationGuardResult === 'success' ? '✅' : '❌'}`);
            if (frontendRan) parts.push(`프론트엔드 ${frontendResult === 'success' ? '✅' : '❌'}`);
            const summary = parts.join(' · ');

            const body = failed
              ? `❌ **빌드 통합 실패**\n\n${summary}\n\n머지 대상 브랜치와 합치는 과정에서 빌드가 실패해 머지할 수 없습니다. [로그](${runUrl})를 확인하고 수정 후 다시 푸시해주세요.\n\n${note}`
              : `✅ **빌드 통합 성공**\n\n${summary}\n\n리뷰어 중 한 명이 승인하면 머지할 수 있습니다.\n\n${note}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
