<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">프로젝트를 숫자로 보기</title>
  <desc id="description">2026년 8월 1일 기준, 42일간 Git 기여자 6명이 dev 브랜치에 644개 커밋을 만들고 75개 실행 티켓을 완료했다.</desc>

  <rect width="1200" height="630" rx="32" fill="#F7F7F5"/>
  <path d="M0 32C0 14.3 14.3 0 32 0h1136c17.7 0 32 14.3 32 32v10H0V32Z" fill="#FF7710"/>

  <g font-family="Pretendard, SUIT, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="72" y="115" fill="#171717" font-size="22" font-weight="700" letter-spacing="-.4">PROJECT SNAPSHOT</text>
    <text x="72" y="168" fill="#171717" font-size="42" font-weight="800" letter-spacing="-1.6">프로젝트를 숫자로 보기</text>
    <g transform="translate(948 92)">
      <rect width="180" height="42" rx="21" fill="#FFF0E4"/>
      <circle cx="22" cy="21" r="5" fill="#FF7710"/>
      <text x="38" y="28" fill="#8C3C00" font-size="16" font-weight="700">2026.08.01 기준</text>
    </g>

    <!-- duration -->
    <g transform="translate(72 224)">
      <rect width="252" height="246" rx="22" fill="#FFFFFF" stroke="#E4E4E0"/>
      <g transform="translate(24 24)" fill="none" stroke="#FF7710" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="34" height="30" rx="5"/>
        <path d="M10 2v8M28 2v8M2 16h34"/>
      </g>
      <text x="24" y="105" fill="#171717" font-size="50" font-weight="800" letter-spacing="-2">42일</text>
      <text x="24" y="140" fill="#4F4F4F" font-size="19" font-weight="700">함께 만든 기간</text>
      <line x1="24" y1="168" x2="228" y2="168" stroke="#ECECE8"/>
      <text x="24" y="202" fill="#737373" font-size="16" font-weight="600">06.21 — 08.01</text>
      <text x="24" y="226" fill="#9A9A9A" font-size="14">첫 커밋부터 v1 완성까지</text>
    </g>

    <!-- contributors -->
    <g transform="translate(340 224)">
      <rect width="252" height="246" rx="22" fill="#FFFFFF" stroke="#E4E4E0"/>
      <g transform="translate(24 24)" fill="none" stroke="#FF7710" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="13" cy="11" r="8"/>
        <circle cx="31" cy="14" r="6"/>
        <path d="M1 36c1-9 6-13 12-13s11 4 12 13M25 25c7-2 12 2 14 10"/>
      </g>
      <text x="24" y="105" fill="#171717" font-size="50" font-weight="800" letter-spacing="-2">6명</text>
      <text x="24" y="140" fill="#4F4F4F" font-size="19" font-weight="700">Git 기여자</text>
      <line x1="24" y1="168" x2="228" y2="168" stroke="#ECECE8"/>
      <text x="24" y="202" fill="#737373" font-size="16" font-weight="600">PM · FE · BE · 인프라</text>
      <text x="24" y="226" fill="#9A9A9A" font-size="14">전체 팀 8명 · 디자인 2명 포함</text>
    </g>

    <!-- commits -->
    <g transform="translate(608 224)">
      <rect width="252" height="246" rx="22" fill="#FFFFFF" stroke="#E4E4E0"/>
      <g transform="translate(24 24)" fill="none" stroke="#FF7710" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 19h11M29 19h11"/>
        <circle cx="20" cy="19" r="9"/>
        <circle cx="20" cy="19" r="2" fill="#FF7710" stroke="none"/>
      </g>
      <text x="24" y="105" fill="#171717" font-size="50" font-weight="800" letter-spacing="-2">644</text>
      <text x="24" y="140" fill="#4F4F4F" font-size="19" font-weight="700">dev 브랜치 커밋</text>
      <line x1="24" y1="168" x2="228" y2="168" stroke="#ECECE8"/>
      <text x="24" y="202" fill="#737373" font-size="16" font-weight="600">stage로 이어지는 기록</text>
      <text x="24" y="226" fill="#9A9A9A" font-size="14">origin/dev 전체 이력 기준</text>
    </g>

    <!-- tickets -->
    <g transform="translate(876 224)">
      <rect width="252" height="246" rx="22" fill="#171717"/>
      <g transform="translate(24 24)" fill="none" stroke="#FF8B32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 3h28a5 5 0 0 1 5 5v7a6 6 0 0 0 0 12v7a5 5 0 0 1-5 5H4a5 5 0 0 1-5-5v-7a6 6 0 0 0 0-12V8a5 5 0 0 1 5-5Z"/>
        <path d="m11 21 5 5 11-12"/>
