name: CD

on:
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - 'shared/**'
  workflow_dispatch:
    inputs:
      environment:
        description: '배포 환경 (stage / prod)'
        required: true
        default: 'stage'
        type: choice
        options: [stage, prod]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

# CI(ci.yml)처럼 여러 job으로 쪼갰다(2026-07-31, #320 후속) — 예전엔 job 하나(build-and-deploy)
# 안에 15개 스텝이 다 들어있어서 GitHub Actions 그래프에 박스 하나로만 보이고, 실제 흐름(빌드 →
# 배포 → 검증 → 확정/롤백/수동개입 갈림길)을 보려면 스텝을 펼쳐야 했다. job으로 나누면 그래프
# 자체가 절차도가 돼서 지금 어느 단계에서 멈췄는지 한눈에 보인다. job 간 상태 전달은 두 가지뿐:
# ① outputs(문자열, 아래 config·migration-check가 내보냄) ② OCI 서버 파일(.prev_backend_tag_*,
# deploy job이 SSH로 써두면 그 뒤 job들이 다시 SSH로 읽음 — 서버 쪽 상태라 job이 갈려도 그대로 남음).
jobs:
  # ─────────────────────────────────────────────────────────────
  # ① 환경 판별 — dev→stage / main→prod (또는 수동 workflow_dispatch)
  # ─────────────────────────────────────────────────────────────
  config:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.config.outputs.env }}
      tag_prefix: ${{ steps.config.outputs.tag_prefix }}
      service: ${{ steps.config.outputs.service }}
      port: ${{ steps.config.outputs.port }}
    steps:
      - name: 환경 판별
        id: config
        run: |
          # workflow_dispatch 수동 실행 시 input 우선, push 시 브랜치로 판별
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" == "main" ]; then
            ENV="prod"
          else
            ENV="stage"
          fi

          if [ "$ENV" == "prod" ]; then
            echo "env=prod"              >> $GITHUB_OUTPUT
            echo "tag_prefix=prod"       >> $GITHUB_OUTPUT
            echo "service=backend-prod"  >> $GITHUB_OUTPUT
            echo "port=8080"             >> $GITHUB_OUTPUT
          else
            echo "env=stage"             >> $GITHUB_OUTPUT
            echo "tag_prefix=stage"      >> $GITHUB_OUTPUT
            echo "service=backend-stage" >> $GITHUB_OUTPUT
            echo "port=8081"             >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────
  # ② 마이그레이션 위험도 판단 — 이번 배포에 새로 추가된 마이그레이션 파일에
  #    삭제/변경형(drop/rename) 또는 되돌릴 수 없는 DML(update/delete/replace) 패턴이 있는지 grep.
  #    또한 이미 배포된 마이그레이션 파일이 삭제·수정됐으면(Flyway 검증 실패가 확정적) 배포 자체를 막음
  # ─────────────────────────────────────────────────────────────
  migration-check:
    runs-on: ubuntu-latest
    outputs:
      destructive: ${{ steps.migration-check.outputs.destructive }}
      added_migrations_json: ${{ steps.migration-check.outputs.added_migrations_json }}
      total_migration_count: ${{ steps.migration-check.outputs.total_migration_count }}
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0(전체 히스토리) — 아래 "마이그레이션 위험도 판단"이 이전 커밋과
          # diff를 떠야 해서 얕은 체크아웃(기본값 depth 1)으로는 이전 커밋이 없을 수 있음
          fetch-depth: 0

      # #320: 이번 배포에 삭제/컬럼변경형 마이그레이션이 새로 포함됐는지 미리 판단한다 — 왜
      # 필요한가는 아래 "롤백" job 주석 참고. push 이벤트는 GitHub이 주는 이전 커밋(before)과
      # 정확히 diff할 수 있지만, workflow_dispatch(수동 배포)는 "이전 커밋"이 뭔지 알 방법이
      # 없어 안전하게 "위험"으로 취급한다(destructive=unknown). 판정은 이 프로젝트가 SQLite
      # 제약 때문에 컬럼 삭제·이름변경에 항상 쓰는 "테이블 재생성 패턴"(db-migration.md)에
      # 기대는 휴리스틱이다 — 이 패턴을 벗어난 파괴적 SQL은 못 잡을 수 있다는 한계가 있다.
      #
      # (2026-07-31 실측 보강) DROP/RENAME 키워드만 보면 UPDATE/DELETE 같은 순수 DML은
      # "안전(추가형)"으로 오분류된다 — 실제로 V20260728115500(INSERT OR IGNORE)이 이 사각지대에
      # 해당하는 걸 stage 실측 중 발견(그 파일 자체는 멱등해서 무해했음). DROP/RENAME은 "구버전
      # 앱이 바뀐 스키마와 충돌하는가"(호환성) 문제고, UPDATE/DELETE는 "롤백해도 이미 사라진
      # 데이터는 안 돌아온다"(되돌릴 수 없는 데이터 변경) 문제로 종류가 다르지만, 둘 다 "자동
      # 롤백 전에 사람이 보게" 하는 게 맞아서 같은 destructive=true 취급으로 묶는다. INSERT는
      # 기존 행을 안 건드리니 계속 안전 취급 — 단, `INSERT OR REPLACE`/`REPLACE INTO`는 이름은
      # INSERT지만 PK/UNIQUE 충돌 시 기존 행을 지우고 새로 넣는 사실상 DELETE+INSERT라 같은
      # destructive 취급(`INSERT OR IGNORE`는 충돌 시 그냥 건너뛰어 기존 행을 안 건드리므로 계속 안전).
      - name: 마이그레이션 위험도 판단
        id: migration-check
        run: |
          MIGRATION_DIR="backend/src/main/resources/db/migration"
          BEFORE_SHA="${{ github.event.before }}"
          DESTRUCTIVE="unknown"

          if [ "${{ github.event_name }}" == "push" ] \
             && [ -n "$BEFORE_SHA" ] \
             && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            # git diff --diff-filter=A(추가만)는 안 씀 — git이 내용 유사도로 "리네임"이라고
            # 판단해버리면(실제로 V5→V6 리네임 커밋에서 재현 확인) 새 파일인데도 안 잡힌다.
            # 대신 마이그레이션 폴더의 파일 "경로 목록" 자체를 이전/이후로 비교해서, 이전엔
            # 없던 경로면 무조건 새 파일로 취급한다 — git의 리네임 추정 로직에 안 흔들림.
            BEFORE_FILES=$(git ls-tree -r --name-only "$BEFORE_SHA" -- "$MIGRATION_DIR" | sort)
            AFTER_FILES=$(git ls-tree -r --name-only "${{ github.sha }}" -- "$MIGRATION_DIR" | sort)
            ADDED=$(comm -13 <(echo "$BEFORE_FILES") <(echo "$AFTER_FILES"))

            # (2026-08-01 실측 보강) stage 전용 FlywayConfig가 "이미 적용된 마이그레이션 파일이
            # 검증(validate)에 걸리면" 자동으로 DB를 통째로 지우고 재구성하는 사고(#320 검증 중
            # 실제 발생, 관련 커밋 참고)를 낸 적이 있다 — clean() 대신 repair()로 바꿔서 데이터 유실
            # 자체는 막았지만, 그 트리거(이미 배포된 마이그레이션 파일을 지우거나 내용을 고치는 것)는
            # 정상적인 배포 흐름에서 절대 있을 이유가 없는 실수다. 그래서 여기서 배포 자체를 막는다 —
            # destructive=true로 넘겨서 "진행은 시키고 사람이 나중에 본다"로 두면 안 된다(이미 검증
            # 실패가 확정된 상태라 진행할 이유가 없다). stage를 진짜로 초기화하려면 별도의 명시적인
            # Reset Stage DB 워크플로(사람이 직접 "RESET"을 입력해야 실행됨)를 쓸 것.
            REMOVED=$(comm -23 <(echo "$BEFORE_FILES") <(echo "$AFTER_FILES"))
            COMMON=$(comm -12 <(echo "$BEFORE_FILES") <(echo "$AFTER_FILES"))
            MODIFIED=""
            for f in $COMMON; do
              if ! git diff --quiet "$BEFORE_SHA" "${{ github.sha }}" -- "$f"; then
                MODIFIED="$MODIFIED $f"
              fi
            done
            if [ -n "$REMOVED" ] || [ -n "$MODIFIED" ]; then
              echo "❌ 이미 적용된 마이그레이션 파일이 삭제되거나 수정됨 — Flyway 검증 실패가 확정적이라 배포를 막습니다"
              echo "삭제됨: ${REMOVED:-없음}"
              echo "수정됨: ${MODIFIED:-없음}"
              exit 1
            fi

            # 파일별 위험도도 같이 남긴다(#451 인프라 대시보드용) — 지금까지는 이번 배포
            # 전체가 위험한지(DESTRUCTIVE) 하나만 봤는데, 어드민 화면에서 "이번 배포에 뭐가
            # 끼었는지" 보여주려면 파일 단위 목록이 필요하다. 판정 로직 자체는 안 바꾸고
            # 같은 grep 결과를 파일별로도 기록하기만 한다.
            DESTRUCTIVE="false"
            ADDED_JSON="[]"
            FIRST_FILE=true
            for f in $ADDED; do
              # 주석(-- 로 시작하는 줄)은 제외하고 파괴적 패턴만 검사. update/delete는
              # "update <표> set"·"delete from" 구조까지 요구해서 updated_at/updated_by 같은
              # 컬럼명 안의 "update" 부분 문자열은 안 걸리게 한다.
              if git show "${{ github.sha }}:$f" | grep -viE '^[[:space:]]*--' | grep -qiE 'drop[[:space:]]+table|drop[[:space:]]+column|rename[[:space:]]+to|rename[[:space:]]+column|update[[:space:]]+[a-z0-9_]+[[:space:]]+set|delete[[:space:]]+from|or[[:space:]]+replace|replace[[:space:]]+into'; then
                DESTRUCTIVE="true"
                FILE_TYPE="destructive"
              else
                FILE_TYPE="additive"
              fi
              FILE_JSON=$(printf '{"file":"%s","type":"%s"}' "$(basename "$f")" "$FILE_TYPE")
              if [ "$FIRST_FILE" = true ]; then
                ADDED_JSON="[$FILE_JSON"
                FIRST_FILE=false
              else
                ADDED_JSON="$ADDED_JSON,$FILE_JSON"
              fi
            done
            [ "$FIRST_FILE" = false ] && ADDED_JSON="$ADDED_JSON]"
            echo "이번 배포로 새로 추가된 마이그레이션: ${ADDED:-없음}"
          else
            echo "이전 커밋을 알 수 없는 트리거(수동 배포 등) — 안전하게 '위험'으로 취급합니다"
            ADDED_JSON="[]"
          fi

          # 이 SHA 시점에 존재하는 마이그레이션 파일 총 개수 — "이 앱 버전이 DB가 몇 개까지
          # 적용돼 있길 기대하는가"의 기준값(#451 인프라 대시보드, DB 실제 적용 개수와
          # 비교해서 앱-DB가 어긋났는지 보여주는 데 씀). push든 workflow_dispatch든 이 시점엔
          # 이미 github.sha가 체크아웃돼 있으므로 항상 계산 가능.
          TOTAL_MIGRATION_COUNT=$(git ls-tree -r --name-only "${{ github.sha }}" -- "$MIGRATION_DIR" | grep -c '\.sql$' || true)

          echo "destructive=$DESTRUCTIVE" >> "$GITHUB_OUTPUT"
          echo "added_migrations_json=$ADDED_JSON" >> "$GITHUB_OUTPUT"
          echo "total_migration_count=$TOTAL_MIGRATION_COUNT" >> "$GITHUB_OUTPUT"
          echo "판단 결과: $DESTRUCTIVE"

  # ─────────────────────────────────────────────────────────────
  # ③ 이미지 빌드 — docker buildx(arm64) → GHCR 푸시
  # ─────────────────────────────────────────────────────────────
  build:
    needs: config
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: QEMU 설정 (arm64 크로스 빌드용)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          # context를 루트('.')로 설정 — shared/** 공통 모듈을 Docker 빌드 시 참조하기 위함
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ needs.config.outputs.tag_prefix }}-${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:${{ needs.config.outputs.tag_prefix }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # ④~⑧ OCI 배포 — 이전 태그 백업 → (위험할 때만 DB 백업) → 이미지 교체 → 헬스체크
  # ─────────────────────────────────────────────────────────────
  deploy:
    needs: [config, migration-check, build]
    runs-on: ubuntu-latest
    steps:
      - name: OCI 배포 및 헬스체크 (SSH 통합)
        uses: appleboy/ssh-action@v1
        env:
          NEW_TAG: "${{ needs.config.outputs.tag_prefix }}-${{ github.sha }}"
          GHCR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GHCR_USER: "${{ github.actor }}"
          DESTRUCTIVE: "${{ needs.migration-check.outputs.destructive }}"
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: NEW_TAG,GHCR_TOKEN,GHCR_USER,DESTRUCTIVE
          script: |
            set -euo pipefail

            # GHCR 인증 — 서버에서 private 이미지 pull 권한 획득
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            cd ${{ secrets.OCI_DEPLOY_PATH }}
            cd ..

            # 푸시가 일어난 브랜치로 강제 전환 및 최신 코드 다운로드 — git pull(=fetch+merge)은
            # 안 쓴다. 서버 배포 키가 origin에 push를 못 하는데(의도적 최소권한) pull이 매 배포마다
            # 로컬 전용 머지 커밋을 만들어서, 그게 다시 push가 안 되니 다음 배포 때 또 쌓이는 게
            # 반복돼 서버 dev가 origin/dev보다 54커밋 앞서는 상태까지 갔다(2026-07-30 실측·정리
            # 완료, infra/CLAUDE.md "서버 dev 동기화" 절 참고). 이 서버는 배포 전용이라 로컬 전용
            # 커밋이 있을 이유가 없다 — reset --hard로 항상 origin과 정확히 같게 맞춘다.
            TARGET_BRANCH="${{ github.ref_name }}"
            git fetch origin
            git checkout -f $TARGET_BRANCH
            git reset --hard origin/$TARGET_BRANCH

            cd ${{ secrets.OCI_DEPLOY_PATH }}

            # 기존 실행 중인 컨테이너의 이미지 태그 백업 — 파일로 남겨서 뒤에 오는
            # smoke-test/rollback job이 SSH로 다시 읽는다(job이 갈려도 서버 파일은 그대로 남음).
            PREV_TAG=$(docker compose -f docker-compose.yml ps -q ${{ needs.config.outputs.service }} 2>/dev/null \
              | xargs -I{} docker inspect --format='{{index .Config.Image}}' {} 2>/dev/null \
              | grep -oP '(?<=:)[^:]+$' || echo "${{ needs.config.outputs.tag_prefix }}-latest")
            echo $PREV_TAG > .prev_backend_tag_${{ needs.config.outputs.env }}
            echo "백업된 이전 태그: $PREV_TAG"

            # #320: 삭제/컬럼변경형(또는 판단 불가) 마이그레이션이면, 스키마를 건드리기 전에
            # 신선한 DB 백업을 자동으로 한 번 더 뜬다 — 원래 사람이 배포 직전 수동으로 하던
            # 관행(db-access.md "배포 전 수동 백업")을 CD가 대신 실행하는 것뿐, 새 안전장치가
            # 아니다. 이 안전망 없이 위험한 스키마 변경을 미는 건 의미가 없으므로, 백업 자체가
            # 실패하면 배포를 아예 진행하지 않는다 — 이 시점엔 아직 마이그레이션 전이라 DB는
            # 그대로 안전하게 남는다.
            if [ "$DESTRUCTIVE" != "false" ]; then
              echo "⚠ 삭제/변경형 마이그레이션 감지(또는 판단 불가) — 배포 전 자동 백업을 먼저 실행합니다"
              if ! bash scripts/backup-db.sh; then
                echo "❌ 배포 전 백업 실패 — 안전망 없이 위험한 마이그레이션을 진행할 수 없어 배포를 중단합니다"
                exit 1
              fi
              echo "✅ 배포 전 백업 완료"
            fi

            # 배포 환경에 맞는 compose 변수만 세팅 — 다른 환경 컨테이너는 건드리지 않음
            if [ "${{ needs.config.outputs.env }}" == "stage" ]; then
              export STAGE_TAG=$NEW_TAG
            else
              export PROD_TAG=$NEW_TAG
            fi
            docker compose -f docker-compose.yml pull ${{ needs.config.outputs.service }}
            docker compose -f docker-compose.yml up -d ${{ needs.config.outputs.service }}

            # 로컬 -latest 캐시도 레지스트리와 동기화 — 사람이 태그 없이 수동으로
            # `docker compose up -d`를 실행해도 얼어붙은 옛날 이미지가 아닌 최신을 받도록
            docker pull ghcr.io/${{ github.repository }}/backend:${{ needs.config.outputs.tag_prefix }}-latest

            # nginx가 실행 중이 아니면 시작 (--no-recreate: 백엔드 컨테이너 재생성 방지)
            if ! docker compose -f docker-compose.yml ps nginx | grep -q "Up"; then
              echo "nginx 미실행 — 시작합니다"
              docker compose -f docker-compose.yml up -d --no-recreate nginx
            fi

            # 헬스체크 로직 — curl -sf는 완전 침묵이라 대기 중엔 로그에 아무것도 안 찍힘.
            # 매 시도마다 HTTP 상태를 출력하고, 실패 시 컨테이너 로그까지 남겨서
            # SSH로 안 들어가도 CD 로그만으로 원인이 보이게 함.
            echo "=== 헬스체크 시작 ==="
            ELAPSED=0
            until STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:${{ needs.config.outputs.port }}/actuator/health) && [ "$STATUS" == "200" ]; do
              echo "[${ELAPSED}s] 대기 중 — HTTP ${STATUS:-연결 실패}"
              sleep 3
              ELAPSED=$((ELAPSED + 3))
              if [ $ELAPSED -ge 120 ]; then
                echo "❌ 헬스체크 실패 — 마지막 응답: HTTP ${STATUS:-연결 실패}"
                echo "--- ${{ needs.config.outputs.service }} 최근 로그 ---"
                docker compose -f docker-compose.yml logs --tail=50 ${{ needs.config.outputs.service }}
                exit 1
              fi
            done
            echo "✅ 헬스체크 통과"

  # ─────────────────────────────────────────────────────────────
  # ⑨ 스모크 테스트 — 실제 공개 도메인으로 GET (DNS·TLS·nginx까지 실경로 검증)
  # ─────────────────────────────────────────────────────────────
  smoke-test:
    needs: [config, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: 스모크 테스트
        # localhost가 아니라 실제 공개 도메인(nginx 뒤)으로 찌른다 — 헬스체크는 "앱이 떴다"만
        # 보장하지만, 이건 DNS·TLS·nginx 라우팅까지 포함해 실제 클라이언트가 겪는 경로 그대로
        # 검증한다. 인증 없이 이미 공개돼 있는 조회 엔드포인트만 대상(어드민류 제외).
        run: |
          BASE_URL="https://api.${{ needs.config.outputs.env }}.likelion-khu.com"
          echo "=== 스모크 테스트 시작 (${BASE_URL}) ==="

          FAILED=0
          for path in /api/members /api/staff /api/posts /api/projects; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE_URL$path" || echo "000")
            if [ "$STATUS" == "200" ]; then
              echo "✅ [$path] HTTP $STATUS"
            else
              echo "❌ [$path] HTTP ${STATUS}"
              FAILED=1
            fi
          done

          if [ "$FAILED" == "1" ]; then
            echo "=== 스모크 테스트 실패 ==="
            exit 1
          fi
          echo "=== 스모크 테스트 완료 ==="

  # ─────────────────────────────────────────────────────────────
  # ⑩ 배포 확정 — deploy·smoke-test가 전부 성공했을 때만 실행됨(job needs가 자동으로 걸러줌)
  # ─────────────────────────────────────────────────────────────
  confirm:
    needs: [config, deploy, smoke-test]
    runs-on: ubuntu-latest
    steps:
      # 롤백용 이전 태그 마커는 스모크 테스트까지 전부 통과한 뒤에만 지운다 — 헬스체크
      # 직후에 지우면(예전 방식) 그 다음인 스모크 테스트가 실패해도 롤백 job이
      # ".prev_backend_tag_*가 없다"며 그냥 스킵돼버린다(실제로 이렇게 한 번 무력화된 적 있음,
      # #133 dev→main 승격 중 prod에서 실측). 이 job은 deploy·smoke-test 둘 다 성공해야만
      # 실행되므로(needs 기본 동작 — 하나라도 실패하면 이 job은 자동 skip), 마커가 그대로 남아
      # 아래 rollback job이 정상 작동한다.
      - name: 배포 확정 (롤백 마커 정리)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd ${{ secrets.OCI_DEPLOY_PATH }}
            rm -f .prev_backend_tag_${{ needs.config.outputs.env }}

  # ─────────────────────────────────────────────────────────────
  # 자동 롤백 — ②에서 "추가형(안전)"으로 판정된 배포가 deploy 또는 smoke-test에서 실패했을 때만
  # ─────────────────────────────────────────────────────────────
  # #320: 자동 롤백은 "추가형"으로 판정된 배포에서만 실행한다 — 구버전 앱이 새로 생긴
  # 컬럼·테이블을 몰라도 안전하게 무시할 수 있는 조합일 때만 자동 개입이 안전하기
  # 때문이다. 삭제/컬럼변경형(또는 판단 불가) 배포는 이 job을 건너뛰고 바로 아래
  # "manual-intervention" job이 대신 처리한다 — 이유는 그 job 주석 참고.
  # `if: always()`가 필요한 이유: deploy가 실패하면 GitHub Actions는 기본적으로 deploy에
  # 의존하는 이 job을 자동으로 skip한다 — always()로 그 기본 동작을 뚫어야 실패를 감지해서
  # 롤백을 실행할 수 있다.
  rollback:
    needs: [config, migration-check, deploy, smoke-test]
    if: |
      always() &&
      (needs.deploy.result == 'failure' || needs.smoke-test.result == 'failure') &&
      needs.migration-check.outputs.destructive == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: 롤백 (추가형 마이그레이션만 자동 실행)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd ${{ secrets.OCI_DEPLOY_PATH }}

            if [ -f .prev_backend_tag_${{ needs.config.outputs.env }} ]; then
              PREV_TAG=$(cat .prev_backend_tag_${{ needs.config.outputs.env }})
              echo "❌ 배포 실패 — 기존 버전($PREV_TAG)으로 롤백을 시작합니다."

              if [ "${{ needs.config.outputs.env }}" == "stage" ]; then
                export STAGE_TAG=$PREV_TAG
              else
                export PROD_TAG=$PREV_TAG
              fi
              docker compose -f docker-compose.yml up -d ${{ needs.config.outputs.service }}
              rm -f .prev_backend_tag_${{ needs.config.outputs.env }}

              # #320: 되돌린 이미지가 진짜 살아났는지 확인 없이 "완료"라고 찍던 버그를 고침 —
              # 안전장치가 있다는 잘못된 확신이 없는 것보다 위험하다는 게 이슈의 핵심 지적이었음.
              echo "=== 롤백 후 헬스체크 ==="
              ELAPSED=0
              until STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:${{ needs.config.outputs.port }}/actuator/health) && [ "$STATUS" == "200" ]; do
                echo "[${ELAPSED}s] 대기 중 — HTTP ${STATUS:-연결 실패}"
                sleep 3
                ELAPSED=$((ELAPSED + 3))
                if [ $ELAPSED -ge 120 ]; then
                  echo "❌ 롤백한 이미지도 정상 기동하지 못했습니다 — 즉시 수동 개입이 필요합니다 (RUNBOOK.md '1-5. UptimeRobot — DOWN' 참고)"
                  docker compose -f docker-compose.yml logs --tail=50 ${{ needs.config.outputs.service }}
                  exit 1
                fi
              done
              echo "✅ 롤백 완료: $PREV_TAG (헬스체크 통과 확인됨)"
            else
              echo "⚠ 백업된 이전 태그 정보가 없어 롤백을 건너뜁니다."
            fi

  # ─────────────────────────────────────────────────────────────
  # 위험 배포 실패 — ②에서 "삭제/변경형·판단불가"로 판정된 배포가 실패했을 때만
  # ─────────────────────────────────────────────────────────────
  # #320: 삭제/컬럼변경형 마이그레이션 뒤에 배포가 실패하면, 구버전 앱을 자동으로
  # 되돌리는 것 자체가 위험하다 — 이미 사라지거나 이름이 바뀐 컬럼을 구버전 앱이 찾다가
  # 새로운 장애를 만들 수 있다("현재 롤백 단계는 헬스체크도 없이 롤백 완료라고 표시한다"는
  # 이슈의 우려가 바로 이 조합에서 실제로 벌어진다). 그래서 이 경우는 자동 개입을 멈추고
  # 사람에게 넘긴다 — deploy job에서 이미 자동으로 뜬 백업이 판단 재료로 준비돼 있다.
  manual-intervention:
    needs: [config, migration-check, deploy, smoke-test]
    if: |
      always() &&
      (needs.deploy.result == 'failure' || needs.smoke-test.result == 'failure') &&
      needs.migration-check.outputs.destructive != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: 위험 배포 실패 — 자동 롤백 생략, 수동 개입 필요
        run: |
          echo "❌ 삭제/변경형(또는 판단 불가) 마이그레이션이 포함된 배포가 실패했습니다."
          echo "구버전 앱이 바뀐 스키마와 안 맞아 오히려 더 망가질 수 있어, 자동 롤백을 실행하지 않았습니다."
          echo "배포 직전에 자동으로 DB 백업이 떠 있습니다 (infra/docs/db-access.md '백업 전략' 참고)."
          echo ""
          echo "사람이 다음 순서로 판단하세요:"
          echo "  ① 원인을 고쳐서 같은 버전으로 재배포 (fix-forward — 대부분의 실패가 이걸로 해결됨, 우선 검토)"
          echo "  ② 그래도 이전 버전으로 되돌려야 한다면 RUNBOOK.md 수동 절차로 이미지 롤백, 필요시 DB 복원까지 판단"
          exit 1

  # ─────────────────────────────────────────────────────────────
  # 배포 기록 — 어드민 대시보드(#451)용. 이번 배포가 어떻게 끝났는지(확정/롤백/수동개입/빌드실패)와
  # 앱이 기대하는 마이그레이션 개수 vs DB에 실제 적용된 개수를 서버 파일에 한 줄(JSON)로 남긴다.
  # ─────────────────────────────────────────────────────────────
  # always()로 이 job 자체는 항상 실행하되, needs에 올린 job들의 result를 읽어서 이번 배포가
  # 어느 갈림길로 끝났는지 판정한다 — 새 상태를 만들지 않고 이미 존재하는 job 결과(성공/실패/
  # 스킵)만 조합한다. "앱이 기대하는 개수"(migration-check가 계산한 total_migration_count)와
  # "DB가 실제로 가진 개수"(배포 시도 직후 flyway_schema_history를 직접 SELECT)를 나란히
  # 남기면, 화면에서 이 둘이 다른 시점(=롤백으로 앱만 되돌아가고 DB는 안 돌아간 상태 등)을
  # 바로 알아볼 수 있다.
  record-deploy-status:
    needs: [config, migration-check, build, deploy, smoke-test, confirm, rollback, manual-intervention]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 배포 결과 판정
        id: outcome
        run: |
          if [ "${{ needs.confirm.result }}" == "success" ]; then
            OUTCOME="confirmed"
          elif [ "${{ needs.rollback.result }}" == "success" ]; then
            OUTCOME="rolled_back"
          elif [ "${{ needs.rollback.result }}" == "failure" ]; then
            OUTCOME="rollback_failed"
          elif [ "${{ needs.manual-intervention.result }}" != "skipped" ]; then
            OUTCOME="manual_intervention_needed"
          elif [ "${{ needs.migration-check.result }}" == "failure" ]; then
            OUTCOME="migration_check_blocked"
          elif [ "${{ needs.build.result }}" == "failure" ]; then
            OUTCOME="build_failed"
          else
            OUTCOME="unknown"
          fi
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          echo "판정: $OUTCOME"

      - name: 배포 기록을 서버에 남김
        uses: appleboy/ssh-action@v1
        env:
          ENV_NAME: "${{ needs.config.outputs.env }}"
          SHA: "${{ github.sha }}"
          OUTCOME: "${{ steps.outcome.outputs.outcome }}"
          ADDED_MIGRATIONS_JSON: "${{ needs.migration-check.outputs.added_migrations_json || '[]' }}"
          EXPECTED_MIGRATION_COUNT: "${{ needs.migration-check.outputs.total_migration_count || '0' }}"
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: ENV_NAME,SHA,OUTCOME,ADDED_MIGRATIONS_JSON,EXPECTED_MIGRATION_COUNT
          script: |
            set -euo pipefail

            # infra/data/에서 이미 겪은 것과 같은 함정 — docker-compose.yml에 이 디렉터리를
            # 마운트하는 볼륨이 있으면, docker compose up이 먼저 실행되면서(deploy job) 없는
            # 호스트 디렉터리를 root 소유로 자동 생성해버린다. 그래서 여기 mkdir -p는 "처음
            # 한 번은 소용없고"(이미 root 소유로 만들어져 있으니) 그 뒤로도 ubuntu가 못 쓴다 —
            # 실제로 2026-08-06 첫 배포 때 Permission denied로 실측 확인, 인프라 오너가 서버에서
            # 1회 `chown ubuntu:ubuntu`로 해결. 이 mkdir -p는 그 이후(디렉터리가 이미 ubuntu
            # 소유인 정상 상태)에 대비한 것일 뿐, 최초 1회 root 소유 생성 문제 자체는 못 막는다.
            HISTORY_DIR="${{ secrets.OCI_DEPLOY_PATH }}/logs/deploy-history"
            mkdir -p "$HISTORY_DIR"

            DB_FILE="${{ secrets.OCI_DEPLOY_PATH }}/data/${ENV_NAME}.db"
            # 이 배포 시도 직후 DB가 실제로 어디까지 적용됐는지 — flyway_schema_history는
            # Flyway가 스스로 관리하는 표라 이 값이 "진짜 현재 상태"다. DB 파일 자체가
            # 없거나(첫 배포 전 등) 조회가 실패하면 0으로 둔다(그래야 화면에서 "어긋남"으로
            # 보이는 게 맞다 — 없는 걸 있는 척 숨기지 않는다).
            ACTUAL_MIGRATION_COUNT=$(sqlite3 "$DB_FILE" "select count(*) from flyway_schema_history where success=1;" 2>/dev/null || echo 0)

            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            RECORD=$(printf '{"timestamp":"%s","env":"%s","sha":"%s","outcome":"%s","migrations":%s,"expectedMigrationCount":%s,"actualMigrationCount":%s}' \
              "$TIMESTAMP" "$ENV_NAME" "$SHA" "$OUTCOME" "$ADDED_MIGRATIONS_JSON" "$EXPECTED_MIGRATION_COUNT" "$ACTUAL_MIGRATION_COUNT")

            echo "$RECORD" >> "$HISTORY_DIR/${ENV_NAME}.jsonl"
            echo "기록 완료: $RECORD"
