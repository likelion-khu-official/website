      <text x="24" y="140" fill="#E7E7E7" font-size="19" font-weight="700">완료한 실행 티켓</text>
      <line x1="24" y1="168" x2="228" y2="168" stroke="#3C3C3C"/>
      <text x="24" y="202" fill="#C5C5C5" font-size="16" font-weight="600">Task 24 · Sub-task 51</text>
      <text x="24" y="226" fill="#8F8F8F" font-size="14">닫힌 GitHub 이슈 기준</text>
