<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">티켓에서 배포까지 이어지는 AI-native 작업 흐름</title>
  <desc id="description">무엇과 왜, 완료 기준이 담긴 티켓을 Claude와 사람이 함께 연구, 계획, 구현, 품질 검증한 뒤 PR 리뷰를 거쳐 dev stage와 main production에 배포한다.</desc>

  <rect width="1200" height="630" rx="32" fill="#111111"/>
  <circle cx="1068" cy="82" r="180" fill="#FF7710" opacity=".09"/>
  <circle cx="112" cy="624" r="160" fill="#FF7710" opacity=".06"/>

  <g font-family="Pretendard, SUIT, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="72" y="92" fill="#FF8B32" font-size="20" font-weight="800" letter-spacing="1.2">AI-NATIVE DELIVERY</text>
    <text x="72" y="143" fill="#FFFFFF" font-size="40" font-weight="800" letter-spacing="-1.5">티켓이 배포될 때까지</text>
    <text x="72" y="179" fill="#A9A9A9" font-size="18">AI가 맥락과 반복 작업을 잇고, 사람이 방향과 결과를 판단합니다.</text>

    <!-- arrows behind cards -->
    <g fill="none" stroke="#515151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M286 341h54"/>
      <path d="m330 333 10 8-10 8"/>
      <path d="M742 341h54"/>
      <path d="m786 333 10 8-10 8"/>
      <path d="M956 341h40"/>
      <path d="m986 333 10 8-10 8"/>
    </g>

    <!-- ticket -->
    <g transform="translate(72 238)">
      <rect width="214" height="206" rx="20" fill="#1C1C1C" stroke="#3A3A3A"/>
      <rect x="20" y="20" width="60" height="28" rx="14" fill="#FFF0E4"/>
      <text x="50" y="40" fill="#A54800" font-size="13" font-weight="800" text-anchor="middle">TICKET</text>
      <text x="20" y="83" fill="#FFFFFF" font-size="21" font-weight="800">미션을 받는다</text>
      <g fill="#BDBDBD" font-size="16">
        <circle cx="24" cy="116" r="3" fill="#FF7710"/><text x="38" y="122">무엇을 만드는가</text>
        <circle cx="24" cy="148" r="3" fill="#FF7710"/><text x="38" y="154">왜 필요한가</text>
        <circle cx="24" cy="180" r="3" fill="#FF7710"/><text x="38" y="186">완료 기준은 무엇인가</text>
      </g>
    </g>

    <!-- RPIQ loop -->
    <g transform="translate(340 218)">
      <rect width="402" height="246" rx="24" fill="#F7F7F5"/>
      <text x="24" y="39" fill="#686868" font-size="14" font-weight="800" letter-spacing=".8">HUMAN × CLAUDE</text>
      <g transform="translate(24 66)">
        <g>
          <rect width="78" height="92" rx="16" fill="#FFFFFF" stroke="#DFDFDB"/>
          <text x="39" y="44" fill="#FF7710" font-size="30" font-weight="900" text-anchor="middle">R</text>
          <text x="39" y="70" fill="#555555" font-size="14" font-weight="700" text-anchor="middle">Research</text>
        </g>
        <path d="M84 46h16" stroke="#BDBDB8" stroke-width="2"/>
        <g transform="translate(106)">
          <rect width="78" height="92" rx="16" fill="#FFFFFF" stroke="#DFDFDB"/>
          <text x="39" y="44" fill="#FF7710" font-size="30" font-weight="900" text-anchor="middle">P</text>
          <text x="39" y="70" fill="#555555" font-size="14" font-weight="700" text-anchor="middle">Plan</text>
        </g>
        <path d="M190 46h16" stroke="#BDBDB8" stroke-width="2"/>
        <g transform="translate(212)">
          <rect width="78" height="92" rx="16" fill="#171717"/>
          <text x="39" y="44" fill="#FF8B32" font-size="30" font-weight="900" text-anchor="middle">I</text>
          <text x="39" y="70" fill="#EAEAEA" font-size="14" font-weight="700" text-anchor="middle">Implement</text>
        </g>
        <path d="M296 46h16" stroke="#BDBDB8" stroke-width="2"/>
        <g transform="translate(318)">
          <rect width="78" height="92" rx="16" fill="#FFFFFF" stroke="#FF7710" stroke-width="2"/>
          <text x="39" y="44" fill="#FF7710" font-size="30" font-weight="900" text-anchor="middle">Q</text>
          <text x="39" y="70" fill="#555555" font-size="14" font-weight="700" text-anchor="middle">QA</text>
        </g>
      </g>
      <path d="M352 180c0 25-16 38-40 38H90c-24 0-40-13-40-38" fill="none" stroke="#FF7710" stroke-width="2" stroke-dasharray="5 6"/>
      <path d="m45 187 5-9 8 7" fill="none" stroke="#FF7710" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="201" y="225" fill="#777777" font-size="14" font-weight="700" text-anchor="middle">필요하면 되돌아가 다시 검증</text>
    </g>

    <!-- PR -->
    <g transform="translate(796 258)">
      <rect width="160" height="166" rx="20" fill="#1C1C1C" stroke="#3A3A3A"/>
      <g transform="translate(20 20)" fill="none" stroke="#FF8B32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7" cy="7" r="5"/><circle cx="39" cy="39" r="5"/>
        <path d="M7 12v28M21 7h7c6 0 11 5 11 11v16"/>
      </g>
      <text x="20" y="91" fill="#FFFFFF" font-size="21" font-weight="800">PR · 리뷰</text>
      <text x="20" y="122" fill="#BDBDBD" font-size="15">최소 1명 검토</text>
      <text x="20" y="147" fill="#7E7E7E" font-size="14">Closes #ticket</text>
    </g>

    <!-- environments -->
    <g transform="translate(996 238)">
      <rect width="132" height="96" rx="18" fill="#FF7710"/>
      <text x="18" y="32" fill="#6D2900" font-size="13" font-weight="800">DEV</text>
      <text x="18" y="60" fill="#171717" font-size="21" font-weight="900">stage</text>
      <text x="18" y="81" fill="#702B00" font-size="13">자동 배포</text>
      <path d="M66 106v22" stroke="#777777" stroke-width="2"/>
      <path d="m60 121 6 7 6-7" fill="none" stroke="#777777" stroke-width="2"/>
      <rect y="138" width="132" height="96" rx="18" fill="#F7F7F5"/>
      <text x="18" y="170" fill="#777777" font-size="13" font-weight="800">MAIN</text>
      <text x="18" y="198" fill="#171717" font-size="21" font-weight="900">prod</text>
      <text x="18" y="219" fill="#777777" font-size="13">검증 후 공개</text>
    </g>

    <line x1="72" y1="515" x2="1128" y2="515" stroke="#303030"/>
    <g font-size="15">
      <text x="72" y="556" fill="#FFFFFF" font-weight="700">AI의 역할</text>
      <text x="146" y="556" fill="#909090">맥락 읽기 · 초안 · 구현 · 반복 검토 · 문서화</text>
      <text x="654" y="556" fill="#FFFFFF" font-weight="700">사람의 역할</text>
      <text x="742" y="556" fill="#909090">방향 결정 · 트레이드오프 판단 · 결과 승인</text>
    </g>
  </g>
</svg>
