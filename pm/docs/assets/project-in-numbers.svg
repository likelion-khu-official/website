    <line x1="72" y1="522" x2="1128" y2="522" stroke="#DEDED9"/>
    <text x="72" y="562" fill="#666666" font-size="16" font-weight="600">v1 개발 완료</text>
    <text x="196" y="562" fill="#A0A09A" font-size="16">·</text>
    <text x="215" y="562" fill="#666666" font-size="16">2026.08.01 완성본 기준</text>
    <text x="1128" y="562" fill="#8A8A84" font-size="14" text-anchor="end">likelion-khu-official/website</text>
  </g>
